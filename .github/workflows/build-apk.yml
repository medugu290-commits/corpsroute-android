name: Build CorpsRoute Nigeria APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q CorpsRoute-Nigeria-Android-Project.zip -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Verify APK
        run: test -f android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorpsRoute-Nigeria-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
